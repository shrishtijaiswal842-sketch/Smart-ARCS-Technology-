<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChemLab</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--p:#161b22;--b:#30363d;--t:#e6edf3;--m:#8b949e;--a:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;display:grid;grid-template-columns:300px 1fr 340px;height:100vh}
aside,section{padding:12px;overflow:auto;background:var(--p);border-right:1px solid var(--b)}
section.r{border:0;border-left:1px solid var(--b)}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
input{width:100%;padding:8px;border-radius:6px;border:1px solid var(--b);background:var(--bg);color:var(--t)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
button{background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 10px;cursor:pointer}
button.on,button:hover{border-color:var(--a)}
.chem{display:flex;justify-content:space-between;width:100%;text-align:left;margin-bottom:4px}
.chem small{color:var(--m)}
.eq{border:1px solid var(--b);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--bg)}
.eq b{display:block;font-size:15px}.eq span{color:var(--m);font-size:12px}
#ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#ign{border-color:#f0883e;color:#f0883e}
.tag{display:inline-block;margin:2px 4px 0 0;padding:2px 6px;border:1px solid var(--b);border-radius:10px}
@media(max-width:900px){body{grid-template-columns:1fr;height:auto}aside,section{border:0;max-height:40vh}}
</style>
</head>
<body>
<aside>
  <h3 style="margin:0 0 8px">Shelf</h3>
  <input id="q" placeholder="Search chemicals (e.g. copper, HCl, Ba)">
  <div class="tabs" id="tabs"></div>
  <div id="list">Loading...</div>
</aside>
<main>
  <canvas id="cv" width="420" height="520"></canvas>
  <div id="ctl">
    <button id="ign">Ignite</button>
    <button id="clr">Empty beaker</button>
  </div>
  <div id="cnt" style="color:var(--m)"></div>
</main>
<section class="r">
  <h3 style="margin:0 0 8px">Beaker contents</h3>
  <div id="in" style="margin-bottom:12px;color:var(--m)">Empty</div>
  <h3 style="margin:0 0 8px">Reactions</h3>
  <div id="log">Add two or more chemicals to see what happens.</div>
</section>
<script>
const API = '/.netlify/functions/api';
const $ = id => document.getElementById(id);
const SUB = '₀₁₂₃₄₅₆₇₈₉';
const sub = s => s.replace(/(?<=[A-Za-z)])\d+/g, m => [...m].map(d => SUB[d]).join(''));
let chems = [], byId = {}, kind = 'all', contents = [], res = null, flameUntil = 0;

async function load() {
  const r = await fetch(API);
  const d = await r.json();
  chems = d.chemicals; chems.forEach(c => (byId[c.id] = c));
  $('cnt').textContent = d.count + ' reactions available · ' + chems.length + ' chemicals';
  const kinds = ['all', 'acid', 'base', 'salt', 'metal', 'fuel'];
  $('tabs').innerHTML = '';
  kinds.forEach(k => {
    const b = document.createElement('button');
    b.textContent = k; b.className = k === kind ? 'on' : '';
    b.onclick = () => { kind = k; [...$('tabs').children].forEach(x => x.className = x.textContent === k ? 'on' : ''); render(); };
    $('tabs').appendChild(b);
  });
  render();
}
function render() {
  const q = $('q').value.trim().toLowerCase();
  const out = chems.filter(c => (kind === 'all' || c.kind === kind) && (!q || (c.name + ' ' + c.f).toLowerCase().includes(q)));
  $('list').innerHTML = '';
  out.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chem';
    b.innerHTML = '<span>' + c.name + '</span><small>' + sub(c.f) + '</small>';
    b.onclick = () => add(c.id);
    $('list').appendChild(b);
  });
  if (!out.length) $('list').textContent = 'No match';
}
$('q').oninput = render;

async function run(ignite) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents, ignite }) });
  res = await r.json();
  if (ignite && res.flame) flameUntil = performance.now() + 5000;
  $('in').innerHTML = contents.length ? contents.map(i => sub(byId[i].f) + ' (' + byId[i].name + ')').join('<br>') : 'Empty';
  $('log').innerHTML = res.reactions.length ? '' : 'No reaction: these chemicals do not react under these conditions.';
  res.reactions.forEach(x => {
    const d = document.createElement('div');
    d.className = 'eq';
    d.innerHTML = '<b>' + sub(x.eq) + '</b>' + x.tags.map(t => '<span class="tag">' + t + '</span>').join('');
    $('log').appendChild(d);
  });
}
function add(id) { contents.push(id); run(false); }
$('ign').onclick = () => { if (contents.length) run(true); };
$('clr').onclick = () => { contents = []; res = null; bub = []; fl = []; $('in').textContent = 'Empty'; $('log').textContent = 'Add two or more chemicals to see what happens.'; };

// ---- Rendering ----
const cv = $('cv'), x = cv.getContext('2d');
let bub = [], fl = [], cur = [150, 190, 255], curA = 0.25, hgt = 0;
const L = 90, R = 330, T = 140, B = 470;
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function frame() {
  x.clearRect(0, 0, 420, 520);
  const n = Math.min(contents.length, 8);
  const tgtH = contents.length ? (0.25 + 0.08 * n) * (B - T) : 0;
  hgt += (tgtH - hgt) * 0.08;
  const tgt = res && res.liquid ? rgb(res.liquid) : [150, 190, 255];
  const tA = res && res.liquid ? 0.7 : 0.25;
  cur = cur.map((v, i) => v + (tgt[i] - v) * 0.06); curA += (tA - curA) * 0.06;
  const top = B - hgt;
  // liquid
  x.fillStyle = 'rgba(' + cur.map(Math.round).join(',') + ',' + curA + ')';
  x.fillRect(L + 3, top, R - L - 6, hgt);
  // precipitate and deposits
  const solids = res ? [...res.precip, ...res.deposit] : [];
  let y = B;
  solids.forEach(s => { const h = 14; y -= h; x.fillStyle = s.col; x.globalAlpha = 0.95; x.fillRect(L + 3, y, R - L - 6, h); x.globalAlpha = 1; });
  // beaker outline
  x.strokeStyle = '#c9d1d9'; x.lineWidth = 4; x.beginPath(); x.moveTo(L, T - 20); x.lineTo(L, B); x.lineTo(R, B); x.lineTo(R, T - 20); x.stroke();
  // bubbles
  if (res && res.gas.length && Math.random() < 0.6) {
    const g = res.gas[Math.floor(Math.random() * res.gas.length)];
    bub.push({ x: L + 12 + Math.random() * (R - L - 24), y: B - 6, r: 2 + Math.random() * 4, v: 0.8 + Math.random() * 1.6, c: g.col });
  }
  bub = bub.filter(b => b.y > top - 80);
  bub.forEach(b => {
    b.y -= b.v; b.x += Math.sin(b.y / 12) * 0.5;
    x.globalAlpha = b.y < top ? 0.35 : 0.8;
    x.strokeStyle = b.c; x.fillStyle = b.c + '55'; x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.fill(); x.stroke(); x.globalAlpha = 1;
  });
  // flame
  if (res && res.flame && performance.now() < flameUntil) {
    for (let i = 0; i < 4; i++) fl.push({ x: (L + R) / 2 + (Math.random() - 0.5) * 70, y: top - 4, life: 1, c: res.flame });
  }
  fl = fl.filter(p => p.life > 0);
  fl.forEach(p => {
    p.y -= 3; p.x += (Math.random() - 0.5) * 3; p.life -= 0.04;
    x.globalAlpha = Math.max(p.life, 0); x.fillStyle = p.c;
    x.beginPath(); x.arc(p.x, p.y, 4 + p.life * 12, 0, 7); x.fill(); x.globalAlpha = 1;
  });
  // thermometer
  const t = res ? res.temp : 25, pct = Math.min((t - 25) / 400, 1);
  x.fillStyle = '#21262d'; x.fillRect(370, 120, 14, 300);
  x.fillStyle = pct > 0.5 ? '#f85149' : pct > 0.1 ? '#f0883e' : '#58a6ff';
  x.fillRect(370, 420 - 300 * Math.max(pct, 0.02), 14, 300 * Math.max(pct, 0.02));
  x.fillStyle = '#e6edf3'; x.font = '13px system-ui'; x.textAlign = 'center'; x.fillText(Math.round(t) + ' °C', 377, 442);
  requestAnimationFrame(frame);
}
load().then(frame).catch(e => { $('list').textContent = 'Could not load chemicals: ' + e; });
</script>
</body>
</html>
